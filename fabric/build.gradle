plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com'
    }
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    compileOnly files("${rootDir}/libs/Essential-1.21.1-fabric-classes.jar")
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
    modCompileOnly "com.terraformersmc:modmenu:12.0.0-beta.1"

    modLocalRuntime "curse.maven:essential-mod-546670:8301133"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
